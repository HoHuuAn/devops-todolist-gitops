# Defaults for the frontend subchart.
# CI writes back image.tag / image.digest in envs/prod/values.yaml.

replicaCount: 2

image:
  repository: hohuuan2003/devops-todolist-fe
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  # The image is nginx-unprivileged, which runs as UID 101 and listens on
  # 8080; binding 80 would need a capability the container does not have.
  targetPort: 8080

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Matches the nginx-unprivileged image's built-in UID/GID 101.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Progressive delivery. When disabled the chart renders a plain Deployment
# instead, which is the fallback if Argo Rollouts is not installed.
rollout:
  enabled: true
  # Traffic is shifted in stages, with the analysis below running throughout.
  # A failed analysis aborts and returns all traffic to stable immediately.
  steps:
    - setWeight: 10
    - pause: { duration: 5m }
    - setWeight: 25
    - pause: { duration: 5m }
    - setWeight: 50
    - pause: { duration: 10m }
    - setWeight: 100
  analysis:
    enabled: true
    templateName: todolist-error-rate-check
    # Start analysis from the first step so a bad build is caught at 10%
    # traffic rather than after it has already been promoted.
    startingStep: 0
