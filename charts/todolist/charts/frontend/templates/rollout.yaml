{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "frontend.name" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # Argo Rollouts flips these two Services between the stable and canary
      # ReplicaSets; the nginx integration writes the traffic weight onto a
      # generated canary Ingress.
      canaryService: {{ include "frontend.name" . }}-canary
      stableService: {{ include "frontend.name" . }}
      trafficRouting:
        nginx:
          stableIngress: {{ .Release.Name }}
      {{- if .Values.rollout.analysis.enabled }}
      # Runs for the whole rollout alongside the steps below. A failed run
      # aborts the rollout and sends 100% of traffic back to stable.
      analysis:
        templates:
          - templateName: {{ .Values.rollout.analysis.templateName }}
        startingStep: {{ .Values.rollout.analysis.startingStep }}
        args:
          - name: service-name
            value: {{ include "frontend.name" . }}-canary
          - name: namespace
            value: {{ .Release.Namespace }}
      {{- end }}
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "frontend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
{{- end }}
