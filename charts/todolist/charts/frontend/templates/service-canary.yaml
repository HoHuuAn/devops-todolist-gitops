{{- if .Values.rollout.enabled }}
# Argo Rollouts points this Service at the canary ReplicaSet during a rollout
# by injecting a rollouts-pod-template-hash selector. It intentionally has no
# hand-written pod selector beyond the app labels.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend.name" . }}-canary
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/variant: canary
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "frontend.selectorLabels" . | nindent 4 }}
{{- end }}
