apiVersion: v2
name: todolist
description: Umbrella chart for the devops-todolist stack (frontend, backend, redis)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: backend
    version: 0.1.0
    repository: "file://charts/backend"
    condition: backend.enabled
  - name: frontend
    version: 0.1.0
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: redis
    version: 0.1.0
    repository: "file://charts/redis"
    condition: redis.enabled
